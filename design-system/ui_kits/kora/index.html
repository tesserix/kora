<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kora — Tesserix UI Kit</title>
<link rel="stylesheet" href="../../styles.css" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous" onerror="(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js';s.crossOrigin='anonymous';document.head.appendChild(s);})()"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html,body{margin:0;height:100%}
  body{background:oklch(0.97 0.008 160);display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-sans);padding:24px 0}
  .phone{position:relative;width:414px;height:864px;border-radius:56px;background:#0c0f0d;padding:12px;box-shadow:0 40px 80px -20px rgba(0,0,0,0.4),0 0 0 2px rgba(0,0,0,0.6)}
  .screen{position:relative;width:390px;height:840px;border-radius:46px;overflow:hidden;background:var(--background);color:var(--foreground)}
  .island{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:118px;height:32px;background:#000;border-radius:20px;z-index:100;pointer-events:none}
  .home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:999px;background:currentColor;opacity:0.28;z-index:60;pointer-events:none}
  .tweaks{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:999;font-family:var(--font-sans)}
  .seg{display:flex;background:#f1f3f2;border-radius:999px;padding:2px}
  .seg button{border:none;background:none;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;color:#64748b;cursor:pointer}
  .seg button.on{background:#fff;color:#0f172a;box-shadow:0 1px 2px rgba(0,0,0,0.1)}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="MealDetail.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="CaptureScreen.jsx"></script>
<script type="text/babel" src="CoachScreen.jsx"></script>
<script type="text/babel" src="InsightsScreen.jsx"></script>
<script type="text/babel" src="PlannerScreen.jsx"></script>
<script type="text/babel" src="RestaurantScreen.jsx"></script>
<script type="text/babel" src="DiaryScreen.jsx"></script>
<script type="text/babel" src="ProgressScreen.jsx"></script>
<script type="text/babel" src="AddonsScreen.jsx"></script>
<script type="text/babel" src="Onboarding.jsx"></script>
<script type="text/babel" src="KoraApp.jsx"></script>

<script type="text/babel" data-presets="react">
function Shell(){
  const [theme,setTheme]=React.useState("iris");
  const [appearance,setAppearance]=React.useState("light");
  const [capture,setCapture]=React.useState("both");
  const [booted,setBooted]=React.useState(false);
  React.useEffect(()=>{ const t=setInterval(()=>{ if(window.lucide){setBooted(true);clearInterval(t);} },60); return ()=>clearInterval(t); },[]);
  const App = window.KoraApp;
  return (
    <>
      <div className="phone">
        <div className="island"></div>
        <div className={"screen "+(appearance==="dark"?"dark":"light")} data-theme={theme} key={theme+appearance+capture}>
          {App ? <App captureMode={capture} /> : null}
          <div className="home-ind"></div>
        </div>
      </div>
      <div className="tweaks">
        <div className="seg">
          {["light","dark"].map(a=><button key={a} className={appearance===a?"on":""} onClick={()=>setAppearance(a)}>{a==="light"?"Light":"Dark"}</button>)}
        </div>
        <div className="seg">
          {[["both","Photo + Chat"],["chat","Chat only"]].map(([v,l])=><button key={v} className={capture===v?"on":""} onClick={()=>setCapture(v)}>{l}</button>)}
        </div>
      </div>
    </>
  );
}
(function mount(){
  if(!window.KoraApp){ setTimeout(mount,80); return; }
  ReactDOM.createRoot(document.getElementById("root")).render(<Shell/>);
  if(window.lucide) window.lucide.createIcons();
})();
</script>
</body>
</html>
