<!-- @dsCard group="Spacing" viewport="700x160" name="Radius & Elevation" subtitle="Corner radii and the box-shadow scale" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;font-family:var(--font-sans);color:var(--foreground);background:var(--background)}.wrap{padding:22px 24px;display:flex;gap:34px}.grp{display:flex;gap:16px;align-items:flex-end}.s{display:flex;flex-direction:column;align-items:center;gap:8px}.box{width:52px;height:52px;background:var(--card);border:1px solid var(--border)}.n{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}.lbl{font-size:10px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.07em;font-weight:600;align-self:flex-start;margin-bottom:4px}</style></head>
<body><div class="wrap">
<div><div class="lbl">Radius</div><div class="grp">
<div class="s"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="n">sm 6</span></div>
<div class="s"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="n">lg 10</span></div>
<div class="s"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="n">xl 16</span></div>
<div class="s"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="n">2xl 24</span></div>
</div></div>
<div><div class="lbl">Elevation</div><div class="grp">
<div class="s"><div class="box" style="box-shadow:var(--shadow-sm);border-color:transparent"></div><span class="n">sm</span></div>
<div class="s"><div class="box" style="box-shadow:var(--shadow-md);border-color:transparent"></div><span class="n">md</span></div>
<div class="s"><div class="box" style="box-shadow:var(--shadow-lg);border-color:transparent"></div><span class="n">lg</span></div>
<div class="s"><div class="box" style="box-shadow:var(--shadow-xl);border-color:transparent"></div><span class="n">xl</span></div>
</div></div>
</div></body></html>
