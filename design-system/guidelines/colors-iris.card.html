<!-- @dsCard group="Colors" viewport="700x150" name="Iris — App Primary" subtitle="Custom OKLCH electric indigo (hue 285) — the Plate brand color" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;font-family:var(--font-sans);background:var(--background)}.wrap{padding:20px}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.s{display:flex;flex-direction:column;gap:6px}.sw{height:64px;border-radius:var(--radius-lg);border:1px solid var(--border)}.n{font-size:11px;font-weight:600;color:var(--foreground)}.h{font-size:10px;color:var(--muted-foreground);font-family:var(--font-mono)}</style></head>
<body><div class="wrap"><div class="g">
<div class="s"><div class="sw" style="background:var(--primary)"></div><span class="n">Primary</span><span class="h">iris · 285</span></div>
<div class="s"><div class="sw" style="background:var(--secondary)"></div><span class="n">Secondary</span></div>
<div class="s"><div class="sw" style="background:var(--accent)"></div><span class="n">Accent</span></div>
<div class="s"><div class="sw" style="background:var(--muted)"></div><span class="n">Muted</span></div>
<div class="s"><div class="sw" style="background:var(--border)"></div><span class="n">Border</span></div>
</div></div></body></html>
