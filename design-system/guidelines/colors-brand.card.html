<!-- @dsCard group="Colors" viewport="700x150" name="Brand & Surface" subtitle="Primary, secondary, muted, accent, and surfaces (default theme)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;font-family:var(--font-sans);background:var(--background)}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:16px}.s{display:flex;flex-direction:column;gap:6px}.sw{height:64px;border-radius:var(--radius-lg);border:1px solid var(--border)}.n{font-size:11px;color:var(--foreground);font-weight:600}.h{font-size:10px;color:var(--muted-foreground);font-family:var(--font-mono)}.g{gap:14px}</style></head>
<body><div class="g">
<div class="s"><div class="sw" style="background:var(--primary)"></div><span class="n">Primary</span><span class="h">--primary</span></div>
<div class="s"><div class="sw" style="background:var(--secondary)"></div><span class="n">Secondary</span><span class="h">--secondary</span></div>
<div class="s"><div class="sw" style="background:var(--muted)"></div><span class="n">Muted</span><span class="h">--muted</span></div>
<div class="s"><div class="sw" style="background:var(--accent)"></div><span class="n">Accent</span><span class="h">--accent</span></div>
<div class="s"><div class="sw" style="background:var(--card)"></div><span class="n">Card</span><span class="h">--card</span></div>
<div class="s"><div class="sw" style="background:var(--foreground)"></div><span class="n">Foreground</span><span class="h">--foreground</span></div>
</div></body></html>
