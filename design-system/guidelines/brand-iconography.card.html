<!-- @dsCard group="Brand" viewport="700x180" name="Iconography — Lucide" subtitle="Lucide, 2px stroke, 24px default. Tesserix's icon system." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>body{margin:0;font-family:var(--font-sans);color:var(--foreground);background:var(--background)}.wrap{padding:24px;display:flex;flex-wrap:wrap;gap:26px;align-items:center}.i{display:flex;flex-direction:column;align-items:center;gap:8px}.n{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}.i svg{width:28px;height:28px;stroke:var(--foreground)}</style></head>
<body><div class="wrap" id="w">
<div class="i"><i data-lucide="camera"></i><span class="n">camera</span></div>
<div class="i"><i data-lucide="sparkles"></i><span class="n">sparkles</span></div>
<div class="i"><i data-lucide="flame"></i><span class="n">flame</span></div>
<div class="i"><i data-lucide="droplet"></i><span class="n">droplet</span></div>
<div class="i"><i data-lucide="footprints"></i><span class="n">footprints</span></div>
<div class="i"><i data-lucide="pill"></i><span class="n">pill</span></div>
<div class="i"><i data-lucide="moon"></i><span class="n">moon</span></div>
<div class="i"><i data-lucide="scale"></i><span class="n">scale</span></div>
<div class="i"><i data-lucide="heart-pulse"></i><span class="n">heart-pulse</span></div>
<div class="i"><i data-lucide="utensils"></i><span class="n">utensils</span></div>
<div class="i"><i data-lucide="trending-up"></i><span class="n">trending-up</span></div>
<div class="i"><i data-lucide="plus"></i><span class="n">plus</span></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
