<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Kora App" description="Full interactive Kora AI food-tracking prototype — onboarding, Otto-led home, AI capture, coach, diary, progress." -->
<helmet>
<script src="./ds-base.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:oklch(0.97 0.008 160);padding:24px 0;font-family:var(--font-sans)">
  <div style="position:relative;width:414px;height:864px;border-radius:56px;background:#0c0f0d;padding:12px;box-shadow:0 40px 80px -20px rgba(0,0,0,0.4),0 0 0 2px rgba(0,0,0,0.6)">
    <div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:118px;height:32px;background:#000;border-radius:20px;z-index:100;pointer-events:none"></div>
    <div class="{{ screenClass }}" data-theme="iris" style="position:relative;width:390px;height:840px;border-radius:46px;overflow:hidden;background:var(--background);color:var(--foreground)">
      <x-import component-from-global-scope="KoraApp" capture-mode="{{ captureMode }}" hint-size="390px,840px"></x-import>
      <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:999px;background:currentColor;opacity:0.28;z-index:60;pointer-events:none"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:900},&quot;appearance&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;},&quot;captureMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;chat&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;'both'|'chat'&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this._iv = setInterval(() => { if (window.lucide) window.lucide.createIcons(); }, 400);
  }
  componentWillUnmount() { clearInterval(this._iv); }
  renderVals() {
    const appearance = this.props.appearance ?? "light";
    const captureMode = this.props.captureMode ?? "both";
    return { captureMode, screenClass: appearance === "dark" ? "screen dark" : "screen light" };
  }
}
</script>
</body>
</html>
