name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: kora
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kora" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum
      - name: Vet
        run: cd api && go vet ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://kora:kora_dev@localhost:5432/kora?sslmode=disable
        run: |
          cd api
          TEST_DATABASE_URL=postgres://kora:kora_dev@localhost:5432/kora?sslmode=disable go run ./cmd/migrate
          go test -race -p 1 -coverprofile=coverage.out ./...

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: cd apps/mobile && npm ci
      - run: cd apps/mobile && npx tsc --noEmit
      - run: cd apps/mobile && npm test

  build-image:
    if: github.ref == 'refs/heads/main'
    needs: [api]
    runs-on: ubuntu-latest
    # Push to GHCR under the tesserix org; the GKE fleet pulls it via the
    # ghcr-remote pull-through mirror in tesseracthub-480811 (matches every
    # other service). Needs packages:write on GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/tesserix/kora/kora-api
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" api/
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
