name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
        env:
          POSTGRES_DB: kora
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kora" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum
      - name: Vet
        run: cd api && go vet ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://kora:kora_dev@localhost:5432/kora?sslmode=disable
        run: |
          cd api
          go run ./cmd/migrate
          go test -race -p 1 -coverprofile=coverage.out ./...

  mobile:
    uses: tesserix/tesserix-workflows/.github/workflows/expo-ci.yml@v2.1.0
    with:
      working_directory: apps/mobile
      install_directory: apps/mobile
      lockfile_path: apps/mobile/package-lock.json
      node_version: 22.19.0
      package_manager: npm
      lint_suppressions_path: apps/mobile/eslint-suppressions.json
      audit_config_path: apps/mobile/audit-ci.jsonc

  secrets:
    uses: tesserix/tesserix-workflows/.github/workflows/secret-scan.yml@v2.1.0

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [api, mobile, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Refuse failed or cancelled checks
        env:
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
        run: |
          test "$HAS_CANCELLED" = false
          test "$HAS_FAILURE" = false

  build-image:
    if: github.ref == 'refs/heads/main'
    needs: [gate]
    runs-on: ubuntu-latest
    # Push to GHCR under the tesserix org; the GKE fleet pulls it via the
    # ghcr-remote pull-through mirror in tesseracthub-480811 (matches every
    # other service). Needs packages:write on GITHUB_TOKEN.
    permissions:
      # contents: write — the `deploy` branch advance below is a git push.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/tesserix/kora/kora-api
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" api/
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Kargo watches `deploy`, NOT `main`, and derives the image tag from the
      # commit it finds there. Two failure modes make this indirection load-bearing:
      #
      # 1. Image-tag discovery is unusable here. kora-api already has >=100
      #    published tags, and the registry paginates at 100 in arbitrary order
      #    while Kargo's discoveryLimit is hard-capped at 100. NewestBuild then
      #    never sees the newest build and silently promotes the newest of the
      #    stale page-1 tags — flapping prod backwards. devai hit exactly this on
      #    2026-06-09; see kargo-manifests/projects/devai/warehouses/services.yaml.
      #
      # 2. Watching `main` directly races the build. Kargo would promote a commit
      #    whose image does not exist yet, the pod would pull a missing tag, and
      #    the GAR pull-through mirror negative-caches that 404 — an
      #    ImagePullBackOff that does not recover on its own.
      #
      # Advancing `deploy` only after both pushes succeed makes "this commit is
      # on deploy" mean "this commit's image is pullable".
      - name: Advance deploy branch
        run: git push origin "${{ github.sha }}:refs/heads/deploy" --force
