<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Kora">
  <title>Kora</title>
  <!-- Android adaptive-icon FOREGROUND. Transparent; the launcher composites it
       over kora-adaptive-background and crops to a shape of its choosing.
       Scaled to 0.78 because the crop keeps only a centred circle of ~66% of the
       canvas (radius 338px) while the mark at full size reaches 411px from
       centre — the corner dots of the K would be cut off. 0.822 is the exact
       limit; 0.78 leaves margin for launchers that crop tighter. -->
  <g transform="translate(512 512) scale(0.78) translate(-512 -512)">
    <g fill="#26402E">
      <circle cx="512" cy="292" r="56"/>
      <circle cx="732" cy="512" r="56"/>
      <circle cx="512" cy="732" r="56"/>
    </g>
    <g fill="#3DDC6E">
      <circle cx="292" cy="292" r="100"/>
      <circle cx="292" cy="512" r="100"/>
      <circle cx="292" cy="732" r="100"/>
      <circle cx="512" cy="512" r="100"/>
      <circle cx="732" cy="292" r="100"/>
      <circle cx="732" cy="732" r="100"/>
    </g>
  </g>
</svg>
