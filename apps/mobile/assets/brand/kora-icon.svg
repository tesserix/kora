<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Kora">
  <title>Kora</title>
  <!-- Constellation K. A 3x3 memory grid (spacing 220, centres at 292/512/732);
       six lit dots trace a K, three stay dim — a remembered pattern lighting up.
       Full-bleed square with no transparency: iOS applies its own corner mask.
       Geometry is shared with kora-foreground.svg and kora-monochrome.svg —
       change one, change all three. -->
  <rect width="1024" height="1024" fill="#0A0D0B"/>

  <!-- unlit: still smaller AND dimmer, so the pattern survives a monochrome
       variant where only the size difference remains -->
  <g fill="#26402E">
    <circle cx="512" cy="292" r="56"/>
    <circle cx="732" cy="512" r="56"/>
    <circle cx="512" cy="732" r="56"/>
  </g>

  <!-- lit: left column (spine) + centre (junction) + two right arms = K -->
  <g fill="#3DDC6E">
    <circle cx="292" cy="292" r="100"/>
    <circle cx="292" cy="512" r="100"/>
    <circle cx="292" cy="732" r="100"/>
    <circle cx="512" cy="512" r="100"/>
    <circle cx="732" cy="292" r="100"/>
    <circle cx="732" cy="732" r="100"/>
  </g>
</svg>
